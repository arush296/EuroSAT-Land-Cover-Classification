<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Classify EuroSAT satellite images with a fine-tuned ResNet18 model."
    />
    <title>EuroSAT Classifier</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">Satellite land-cover classification</p>
        <h1>EuroSAT Classifier</h1>
        <p class="subtitle">
          Upload a satellite image to classify its land-cover type.
        </p>
      </header>

      <section class="card">
        <form id="prediction-form">
          <label class="upload" for="image-input">
            <span>Choose a satellite image</span>
            <small>JPEG, PNG, WebP, TIFF or BMP · maximum 10 MB</small>
          </label>
          <input id="image-input" name="file" type="file" accept="image/*" />

          <div id="preview-wrapper" class="preview" hidden>
            <img id="image-preview" alt="Selected satellite image preview" />
            <p id="file-name"></p>
          </div>

          <button id="predict-button" type="submit" disabled>
            Classify image
          </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section id="results" class="results" aria-live="polite" hidden>
          <p class="result-label">Prediction</p>
          <div class="primary-result">
            <h2 id="predicted-class"></h2>
            <span id="predicted-score"></span>
          </div>
          <div id="top-predictions" class="rankings"></div>
        </section>
      </section>

      <p id="backend-status" class="backend-status">Checking backend…</p>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
